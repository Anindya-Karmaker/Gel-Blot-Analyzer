# Conda environment configuration for Gel Blot Analyzer (v9.3)
#
# To create this environment, run:
# > conda env create -f environment.yml
#
# To activate this environment, run:
# > conda activate gel_analyzer_env
#
# To update an EXISTING environment after pulling a new version, run:
# > conda env update -f environment.yml --prune
#
# -----------------------------------------------------------------------------
# WHY THIS FILE INSTALLS ALMOST NOTHING VIA CONDA
# -----------------------------------------------------------------------------
# Previous versions installed numpy, scipy and scikit-image with CONDA and then
# opencv-python with PIP. That split is what produced the long-standing Windows
# NumPy failure, which users worked around with:
#
#     pip install --force-reinstall --no-cache-dir numpy scikit-image
#
# numpy, scipy, scikit-image, opencv and matplotlib all ship compiled code linked
# against NumPy's C API. When two package managers each install part of that set,
# neither can see the other's NumPy ABI, and you end up with an extension built
# for NumPy 1.x being imported under NumPy 2.x:
#
#     "A module that was compiled using NumPy 1.x cannot be run in NumPy 2.x"
#     (or: ImportError: numpy.core.multiarray failed to import)
#
# Conda cannot solve for pip's wheels and pip will not renegotiate conda's, so
# the mismatch is a matter of luck. The fix is to let ONE resolver own the whole
# NumPy-linked set: conda provides the interpreter, pip installs the libraries
# from requirements.txt (which additionally refuses source builds, so no wheel is
# ever compiled against the wrong NumPy).
#
# This also makes requirements.txt the single source of truth for versions — the
# two files can no longer drift apart, because this one just installs that one.
# -----------------------------------------------------------------------------
name: gel_analyzer_env

channels:
  - conda-forge
  - defaults

dependencies:
  # --- Interpreter only ---
  # Python 3.9 is also the ceiling for several pins in requirements.txt
  # (numpy < 2.1, scipy < 1.14, scikit-image < 0.25 all require Python >= 3.10
  # for their newer releases). Raising this also raises those ceilings.
  - python=3.9
  - pip

  # --- Everything else comes from requirements.txt via a single pip resolve ---
  # Do NOT add numpy, scipy, scikit-image, opencv, matplotlib or any other
  # compiled, NumPy-linked package here. Adding one back re-creates the split
  # described above and the Windows NumPy crash returns.
  - pip:
    - -r requirements.txt
